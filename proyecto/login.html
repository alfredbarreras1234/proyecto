<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | La Nación</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="container">
        <section class="login-form">
            <img class="login-img" src="imagenes/logo.png"
                alt="Logo de La Nación"
                width="100"
                height="100">

            <h1>Iniciar sesión</h1>

            <div>
                <label for="usuario">Usuario:
                    <input type="text" id="usuario" placeholder="Escriba su usuario">
                </label>
            </div>
            <div>
                <label for="contrasena">Contraseña:
                    <input type="password" id="contrasena" placeholder="Ingrese su contraseña">
                </label>
            </div>

            <p class="error-message" id="loginError">Por favor complete usuario y contraseña.</p>

            <div><button type="button" onclick="iniciarSesion()">Iniciar sesión</button></div>
            <div><button type="button" class="secondary-btn" onclick="window.location.href='./registrarse.html'">Registrarse</button></div>
        </section>
    </main>

    <script>
        function iniciarSesion() {
            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            const error = document.getElementById('loginError');

            if (usuario === '' || contrasena === '') {
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none';
            window.location.href = './index.html';
        }
    </script>
</body>
</html>
